line-length = 100
target-version = "py312"

[lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: likely bugs, UP: modern syntax
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
"migrations/*" = ["E402"]

[lint.flake8-bugbear]
# FastAPI's Depends() in argument defaults is the intended pattern, not a bug.
extend-immutable-calls = ["fastapi.Depends"]
