name: order-service CI

on:
  pull_request:
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-ci.yml"

# Cancel an older run of the same branch when a new commit is pushed.
concurrency:
  group: order-service-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read   # least privilege: the workflow can only read the repo

defaults:
  run:
    working-directory: services/order-service

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/order-service/requirements-dev.txt
      - run: pip install ruff==0.8.4
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/order-service/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  migrations-postgres:
    # Unit tests use SQLite; this job proves migrations work on REAL Postgres.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orders
          POSTGRES_PASSWORD: ci_pw
          POSTGRES_DB: orders
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orders -d orders"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orders:ci_pw@localhost:5432/orders
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/order-service/requirements-dev.txt
      - run: pip install -r requirements.txt
      - name: upgrade -> downgrade -> upgrade
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  docker-build:
    runs-on: ubuntu-latest
    needs: [lint, test, migrations-postgres]   # only build if the checks pass
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/order-service
          push: false
          tags: order-service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
